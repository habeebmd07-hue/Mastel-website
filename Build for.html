<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How We Work</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1400px;
    height: 814px;
    font-family: 'Inter', sans-serif;
    background: #101113;
    background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 60%);
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }

  .title {
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    padding-top: 44px;
    padding-bottom: 30px;
    letter-spacing: -0.01em;
  }

  .panel {
    position: relative;
    margin: 0 40px;
    height: 540px;
    background: linear-gradient(180deg, rgba(255,255,255,0.045) 0%, rgba(255,255,255,0.015) 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
  }

  /* connecting lines + glow, drawn behind cards */
  svg.lines {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .card {
    position: absolute;
    width: 340px;
    height: 175px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    padding: 26px 28px;
    z-index: 3;
  }

  .card .icon {
    width: 44px; height: 44px;
    margin: 0 auto 14px auto;
    display: flex; align-items: center; justify-content: center;
  }
  .card .icon svg { width: 34px; height: 34px; stroke: #ffffff; }

  .card h3 {
    text-align: center;
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .card p {
    text-align: center;
    font-size: 14.5px;
    color: rgba(255,255,255,0.45);
    font-weight: 500;
  }

  .center-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 96px; height: 96px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    z-index: 3;
    box-shadow: 0 0 40px rgba(58,155,219,0.25);
  }
  .center-icon svg { width: 42px; height: 42px; stroke: #ffffff; }

  /* card positions */
  #c1 { top: 40px;  left: 60px; }
  #c2 { top: 40px;  right: 60px; }
  #c3 { bottom: 40px; left: 60px; }
  #c4 { bottom: 40px; right: 60px; }
</style>
</head>
<body>

  <div class="title">How We Work</div>

  <div class="panel">
    <svg class="lines" viewBox="0 0 1320 540" preserveAspectRatio="none">
      <defs>
        <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3a9bdb"/>
          <stop offset="100%" stop-color="#7fd0f7"/>
        </linearGradient>
        <filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3a9bdb" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#3a9bdb" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="660" cy="270" rx="300" ry="220" fill="url(#haloGlow)"/>

      <!-- top-left card to center -->
      <path d="M 400 165 C 500 165, 560 200, 620 240" fill="none" stroke="url(#glowLine)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>
      <!-- top-right card to center -->
      <path d="M 920 165 C 820 165, 760 200, 700 240" fill="none" stroke="url(#glowLine)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>
      <!-- bottom-left card to center -->
      <path d="M 400 375 C 400 330, 400 300, 400 260" fill="none" stroke="url(#glowLine)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>
      <!-- bottom-right card to bottom-left card (mirrors reference's cross-link) -->
      <path d="M 400 375 C 550 400, 780 395, 920 375" fill="none" stroke="url(#glowLine)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>
      <!-- top-right card down to bottom-right -->
      <path d="M 920 165 C 920 220, 920 300, 920 375" fill="none" stroke="url(#glowLine)" stroke-width="4" stroke-linecap="round" filter="url(#lineGlow)"/>
    </svg>

    <!-- Card 1: Survey -->
    <div class="card" id="c1">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="10" r="3"/>
          <path d="M12 21c-4-4.5-7-8.2-7-11.5A7 7 0 0 1 19 9.5C19 12.8 16 16.5 12 21Z"/>
        </svg>
      </div>
      <h3>Survey</h3>
      <p>On-site capacity planning</p>
    </div>

    <!-- Card 2: Design -->
    <div class="card" id="c2">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </div>
      <h3>Design</h3>
      <p>Vendor-neutral recommendations</p>
    </div>

    <!-- Center icon -->
    <div class="center-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="6" rx="1.5"/>
        <rect x="4" y="15" width="16" height="6" rx="1.5"/>
        <line x1="8" y1="6" x2="8.01" y2="6"/>
        <line x1="8" y1="18" x2="8.01" y2="18"/>
      </svg>
    </div>

    <!-- Card 3: Installation -->
    <div class="card" id="c3">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <h3>Installation</h3>
      <p>Procurement &amp; build</p>
    </div>

    <!-- Card 4: Handover -->
    <div class="card" id="c4">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="m9 15 2 2 4-4"/>
        </svg>
      </div>
      <h3>Handover</h3>
      <p>As-built docs &amp; backups</p>
    </div>

  </div>
</body>
</html>
